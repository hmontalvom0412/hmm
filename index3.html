<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌻Hellen, mi topo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background: linear-gradient(135deg,#fff8dc,#ffe89a);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.card{
    background:white;
    width:90%;
    max-width:500px;
    padding:40px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
    position:relative;
}

.sunflower{
    position:absolute;
    font-size:25px;
    animation:float 4s ease-in-out infinite;
}

.sunflower:nth-child(1){
    top:-15px;
    left:20px;
}

.sunflower:nth-child(2){
    top:-10px;
    right:20px;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-10px);
    }
}

h1{
    color:#d89b00;
    margin-bottom:20px;
}

#message{
    min-height:120px;
    line-height:1.8;
    color:#555;
    font-size:1.05rem;
    transition:.3s;
}

button{
    margin-top:20px;
    border:none;
    background:#ffd54f;
    color:#333;
    padding:12px 24px;
    border-radius:30px;
    cursor:pointer;
    font-size:1rem;
    font-weight:bold;
    transition:.3s;
}

button:hover{
    transform:scale(1.05);
}

.final{
    color:#444;
    animation:fadeIn 1s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>

</head>

<body>

<div class="card">

```
<div class="sunflower">🌻</div>
<div class="sunflower">🌻</div>

<h1>Hellen ✨</h1>

<p id="message">
    Hoy quise hacer algo para ti...
</p>

<button onclick="nextMessage()">
    Haz clic si tienes curiosidad 👀
</button>
```

</div>

<script>

let step = 0;

function nextMessage(){

    const msg = document.getElementById("message");
    const btn = document.querySelector("button");

    step++;

    if(step === 1){
        msg.innerHTML = "Todavía no 😌";
    }

    else if(step === 2){
        msg.innerHTML = "¿Segura que quieres verlo? 👀";
    }

    else if(step === 3){
        msg.innerHTML = "Bueno... está bien 🌻";
    }

    else{
        msg.innerHTML = `
     Bueno si llegaste hasta aquí,
significa que tu curiosidad volvió a ganar como siempre jajaja.

La verdad, no escondí ningún gran secreto.

Solo quería aprovechar este rincón de internet para decirte algo:

Me encantas mucho,
me gusta pasar tiempo contigo
y sobre todo siempre es agradable encontrarte y mirar esos ojos chinitos que tienes.

✨

— Tom

        `;

        btn.style.display = "none";
    }
}

</script>

</body>
</html>
