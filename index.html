<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌻 Hellen</title>

<style>* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: radial-gradient(circle at top, #fff8e1, #f5f5f5);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* ===== CARD MÁS MODERNA ===== */
.card {
  width: 90%;
  max-width: 900px;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 18px;
  padding: 30px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.15);
  text-align: center;
  backdrop-filter: blur(6px);
}

/* ===== GIRASOLES MÁS GRANDES Y ANIMADOS ===== */
.sunflower {
  font-size: 45px;   /* 👈 MÁS GRANDE */
  display: inline-block;
  margin: 0 8px;
  animation: float 3s ease-in-out infinite;
}

/* animación suave */
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

/* ===== TITULO ===== */
h1 {
  color: #d89b00;
  margin-bottom: 15px;
  font-size: 32px;
}

/* ===== TEXTO ===== */
#message h2 {
  color: #222;
  margin-bottom: 10px;
}

#message p {
  color: #666;
}

/* ===== PROGRESS ===== */
.progress {
  width: 100%;
  height: 14px;
  background: #eee;
  border-radius: 30px;
  overflow: hidden;
  margin: 20px 0;
  display: none;
}

.progress-bar {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #f7c600, #ff9800);
  transition: width 0.2s linear;
}

/* ===== BOTÓN MÁS PRO ===== */
button {
  background: linear-gradient(90deg, #f7c600, #ffb300);
  border: none;
  padding: 12px 24px;
  border-radius: 14px;
  font-size: 16px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.3s;
  margin-top: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

button:hover {
  transform: scale(1.05);
}

/* ===== SLIDER MÁS ELEGANTE ===== */
.slider {
  width: 100%;
  height: 380px;
  margin-top: 20px;
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  background: #111;
  box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
}

/* IMÁGENES */
.slide {
  width: 100%;
  height: 100%;
  object-fit: contain;
  position: absolute;
  top: 0;
  left: 0;
  opacity: 0;
  transition: opacity 1s ease-in-out;
}

/* ACTIVA */
.slide.active {
  opacity: 1;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .slider {
    height: 240px;
  }

  h1 {
    font-size: 22px;
  }

  .sunflower {
    font-size: 34px;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="sunflower">🌻</div>
  <div class="sunflower">🌻</div>

  <h1>Hellen ✨</h1>

  <div id="message">
    <h2>¿Lista para sorprenderte una vez más?</h2>
    
  </div>

  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <button onclick="nextMessage()">Ver recuerdos juntos 🌻</button>

</div>

<script>
let iniciado = false;

function nextMessage() {
  if (iniciado) return;
  iniciado = true;

  const msg = document.getElementById("message");
  const btn = document.querySelector("button");
  const bar = document.getElementById("progressBar");
  const prog = document.querySelector(".progress");

  btn.style.display = "none";
  prog.style.display = "block";

  let p = 0;

  const estados = [
    { p: 10, t: "🌻 Buscando recuerdos..." },
    { p: 25, t: "😊 Analizando conversaciones..." },
    { p: 45, t: "😂 Contando risas compartidas..." },
    { p: 65, t: "👀 Detectando ojitos chinos..." },
    { p: 82, t: "💛 Buscando algo único..." },
    { p: 96, t: "✨ Preparando el resultado..." }
  ];

  const i = setInterval(() => {
    p++;
    bar.style.width = p + "%";

    let txt = "Iniciando análisis...";
    estados.forEach(e => {
      if (p >= e.p) txt = e.t;
    });

    msg.innerHTML = `<h2>${p}%</h2><p>${txt}</p>`;

    if (p >= 100) {
      clearInterval(i);

      setTimeout(() => {
        msg.innerHTML = `
          <h2>100% ✔</h2>
          <p>Resultado encontrado...</p>

          <div class="slider">
            <img src="img/hmmhcg.png" class="slide active">
            <img src="img/part1.jpeg" class="slide">
            <img src="img/img4.png" class="slide">
            <img src="img/part2.jpeg" class="slide">
            <img src="img/img3.png" class="slide">
            <img src="img/part3.jpeg" class="slide">
            <img src="img/img4.png" class="slide">
            <img src="img/part4.jpeg" class="slide">
          </div>

          <p style="margin-top:15px;">🌻 Creo que encontré mis imágenes favoritas, traes loco a este humilde programador...,
            Tom💛</p>
        `;

        iniciarCarrusel();
      }, 600);
    }
  }, 40);
}

function iniciarCarrusel() {
  const slides = document.querySelectorAll(".slide");
  let a = 0;

  setInterval(() => {
    slides[a].classList.remove("active");
    a = (a + 1) % slides.length;
    slides[a].classList.add("active");
  }, 2500);
}
</script>

</body>
</html>
